<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Player</title>
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262a33; --text:#e6e8ec; --muted:#8b91a0; --accent:#4f8cff; --red:#ff5a5f; --green:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:grid; grid-template-columns: 340px 1fr; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  main { display:flex; flex-direction:column; min-height:0; overflow:auto; }
  .box { padding:12px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
  input, select, button { font:inherit; color:var(--text); background:#0f1218; border:1px solid var(--line); border-radius:6px; padding:7px 9px; }
  button { background:var(--accent); border-color:var(--accent); color:#fff; cursor:pointer; white-space:nowrap; }
  button.ghost { background:transparent; color:var(--text); border-color:var(--line); }
  button.rec { background:var(--red); border-color:var(--red); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:6px; } .row > input { flex:1; min-width:0; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  #list { overflow:auto; flex:1; }
  .ch { display:flex; align-items:center; gap:10px; padding:8px 12px; cursor:pointer; border-bottom:1px solid #1d2028; }
  .ch:hover { background:#1e222b; } .ch.active { background:#22304d; }
  .ch img { width:36px; height:36px; object-fit:contain; background:#0b0d11; border-radius:4px; flex:none; }
  .ch .ph { width:36px; height:36px; border-radius:4px; background:#0b0d11; flex:none; display:grid; place-items:center; color:var(--muted); font-size:11px; }
  .ch .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .ch .g { color:var(--muted); font-size:12px; }
  .muted { color:var(--muted); font-size:12px; }
  video { width:100%; max-height:62vh; background:#000; display:block; }
  .bar { padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  .bar h2 { margin:0 auto 0 0; font-size:16px; font-weight:600; }
  table { width:100%; border-collapse:collapse; } td, th { padding:8px 16px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:99px; background:#2a2f3a; }
  .pill.recording,.pill.downloading { background:#4a2326; color:#ffb3b5; } .pill.done { background:#173b2c; color:var(--green); } .pill.error { background:#4a2326; }
  .prog { height:4px; background:#2a2f3a; border-radius:2px; margin-top:4px; } .prog > div { height:100%; background:var(--accent); border-radius:2px; }
  #err { color:var(--red); font-size:12px; min-height:1em; }
  @media (max-width: 800px) { body { grid-template-columns:1fr; height:auto; } aside { max-height:55vh; } }
</style>
</head>
<body>
<aside>
  <div class="box">
    <div class="row"><input id="plUrl" placeholder="Playlist URL (.m3u / .m3u8)"><button id="loadBtn">Load</button></div>
    <details><summary>Xtream Codes login</summary>
      <div style="display:grid;gap:6px;margin-top:6px">
        <input id="xtHost" placeholder="http://server:port">
        <div class="row"><input id="xtUser" placeholder="username"><input id="xtPass" placeholder="password" type="password"></div>
        <button id="xtBtn" class="ghost">Load Xtream playlist</button>
      </div>
    </details>
    <div class="row"><input type="file" id="plFile" accept=".m3u,.m3u8,.txt" style="flex:1;min-width:0"></div>
    <div id="err"></div>
  </div>
  <div class="box">
    <input id="q" placeholder="Search channels…">
    <select id="grp"><option value="">All groups</option></select>
    <div class="muted" id="count">No playlist loaded</div>
  </div>
  <div id="list"></div>
</aside>

<main>
  <video id="v" controls playsinline></video>
  <div class="bar">
    <h2 id="now">Nothing playing</h2>
    <div class="row" style="flex:1 1 100%">
      <input id="directUrl" placeholder="…or paste a single stream URL (m3u8 / ts / mp4)">
      <button id="playDirect" class="ghost">Play</button>
    </div>
    <select id="dur" title="Recording length for live streams">
      <option value="0">Until I stop it</option>
      <option value="300">5 min</option><option value="900">15 min</option><option value="1800">30 min</option>
      <option value="3600">1 hour</option><option value="7200">2 hours</option><option value="10800">3 hours</option>
    </select>
    <button id="dlBtn" class="rec" disabled>⏺ Download / Record</button>
    <button id="copyBtn" class="ghost" disabled>Copy URL</button>
  </div>
  <div class="bar" style="border:0;padding-bottom:0"><h2>Downloads</h2><span class="muted" id="outDir"></span></div>
  <table><thead><tr><th>Name</th><th>Status</th><th>Size</th><th></th></tr></thead><tbody id="jobs"></tbody></table>
</main>

<script>
const $ = (id) => document.getElementById(id);
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let channels = [], current = null, hls = null, ts = null;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const fmtBytes = (b) => !b ? '—' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : b < 1073741824 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1073741824).toFixed(2) + ' GB';
const fmtTime = (s) => s == null ? '' : `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const proxied = (ch) => '/proxy?' + new URLSearchParams({ url: ch.url, ...(Object.keys(ch.headers || {}).length ? { h: JSON.stringify(ch.headers) } : {}) });

async function loadPlaylist(url, text) {
  $('err').textContent = ''; $('count').textContent = 'Loading…';
  try {
    const r = text != null ? await fetch('/api/playlist', { method: 'POST', body: text })
                           : await fetch('/api/playlist?url=' + encodeURIComponent(url));
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    channels = d.channels;
    if (url) store.set('lastPlaylist', url);
    const groups = [...new Set(channels.map((c) => c.group))].sort();
    $('grp').innerHTML = '<option value="">All groups (' + groups.length + ')</option>' + groups.map((g) => `<option>${esc(g)}</option>`).join('');
    render();
  } catch (e) { $('err').textContent = e.message; $('count').textContent = 'No playlist loaded'; }
}

function render() {
  const q = $('q').value.toLowerCase(), g = $('grp').value;
  const hits = channels.filter((c) => (!g || c.group === g) && (!q || c.name.toLowerCase().includes(q)));
  const shown = hits.slice(0, 600);
  $('count').textContent = `${hits.length} of ${channels.length} channels` + (hits.length > shown.length ? ` (showing first ${shown.length} — refine search)` : '');
  $('list').innerHTML = shown.map((c) => {
    const i = channels.indexOf(c);
    const img = c.logo ? `<img loading="lazy" src="${esc(c.logo)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'TV'}))">` : '<div class="ph">TV</div>';
    return `<div class="ch${current === c ? ' active' : ''}" data-i="${i}">${img}<div style="min-width:0"><div class="n">${esc(c.name)}</div><div class="g">${esc(c.group)}</div></div></div>`;
  }).join('');
}

function stopPlayer() {
  if (hls) { hls.destroy(); hls = null; }
  if (ts) { ts.destroy(); ts = null; }
  const v = $('v'); v.removeAttribute('src'); v.load();
}

function play(ch) {
  current = ch; stopPlayer(); render();
  $('now').textContent = ch.name; $('dlBtn').disabled = false; $('copyBtn').disabled = false; $('err').textContent = '';
  const v = $('v'), src = proxied(ch);
  const fail = (msg) => { $('err').textContent = 'Playback failed: ' + msg + ' (you can still try Download / Record)'; };
  const type = ch.type === 'unknown' ? 'hls' : ch.type; // most extension-less IPTV URLs are HLS
  if (type === 'hls' && window.Hls?.isSupported()) {
    hls = new Hls({ maxBufferLength: 30 });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (ch.type === 'unknown' && window.mpegts?.isSupported()) { hls.destroy(); hls = null; playTs(src, fail); }
      else fail(d.details);
    });
    hls.loadSource(src); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
  } else if (type === 'hls' && v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = src; v.play().catch(() => {});
  } else if (type === 'mpegts') {
    playTs(src, fail);
  } else {
    v.src = src; v.onerror = () => fail('format not supported by this browser (mkv/avi often are not)'); v.play().catch(() => {});
  }
}

function playTs(src, fail) {
  if (!window.mpegts?.isSupported()) return fail('MPEG-TS not supported in this browser');
  ts = mpegts.createPlayer({ type: 'mpegts', isLive: true, url: location.origin + src });
  ts.on(mpegts.Events.ERROR, (t, d) => fail(t + ' ' + d));
  ts.attachMediaElement($('v')); ts.load(); ts.play();
}

async function download() {
  if (!current) return;
  const duration = Number($('dur').value);
  const r = await fetch('/api/downloads', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: current.url, name: current.name, headers: current.headers, duration }) });
  const d = await r.json();
  if (!r.ok) $('err').textContent = d.error; else pollJobs();
}

async function pollJobs() {
  const { jobs } = await (await fetch('/api/downloads')).json();
  $('jobs').innerHTML = jobs.length ? jobs.map((j) => {
    const active = ['starting', 'downloading', 'recording', 'stopping'].includes(j.status);
    const pct = j.total ? Math.min(100, (j.bytes / j.total) * 100) : j.duration ? Math.min(100, (j.seconds || 0) / j.duration * 100) : null;
    const detail = j.mode === 'ffmpeg' ? fmtTime(j.seconds || 0) + (j.duration ? ' / ' + fmtTime(j.duration) : ' (live)') : (pct != null ? pct.toFixed(0) + '%' : '');
    return `<tr><td>${esc(j.name)}<div class="muted">${esc(j.error || detail)}</div>${pct != null && active ? `<div class="prog"><div style="width:${pct}%"></div></div>` : ''}</td>
      <td><span class="pill ${j.status}">${j.status}</span></td><td>${fmtBytes(j.bytes)}</td>
      <td style="text-align:right">${j.status === 'done' ? `<a href="/files/${encodeURIComponent(j.file)}"><button class="ghost">Save</button></a> ` : ''}
      <button class="ghost" data-job="${j.id}">${active ? 'Stop' : 'Clear'}</button></td></tr>`;
  }).join('') : '<tr><td colspan="4" class="muted">No downloads yet.</td></tr>';
  clearTimeout(pollJobs.t);
  if (jobs.some((j) => !['done', 'error', 'cancelled'].includes(j.status))) pollJobs.t = setTimeout(pollJobs, 1000);
}

$('loadBtn').onclick = () => $('plUrl').value.trim() && loadPlaylist($('plUrl').value.trim());
$('plUrl').onkeydown = (e) => e.key === 'Enter' && $('loadBtn').click();
$('xtBtn').onclick = () => {
  const host = $('xtHost').value.trim().replace(/\/+$/, ''), u = $('xtUser').value.trim(), p = $('xtPass').value;
  if (!host || !u) return;
  const url = `${host}/get.php?` + new URLSearchParams({ username: u, password: p, type: 'm3u_plus', output: 'm3u8' });
  $('plUrl').value = url; loadPlaylist(url);
};
$('plFile').onchange = async (e) => { const f = e.target.files[0]; if (f) loadPlaylist(null, await f.text()); };
$('q').oninput = render; $('grp').onchange = render;
$('list').onclick = (e) => { const el = e.target.closest('.ch'); if (el) play(channels[+el.dataset.i]); };
$('playDirect').onclick = () => {
  const url = $('directUrl').value.trim(); if (!url) return;
  const type = /\.m3u8(\?|$)/i.test(url) ? 'hls' : /\.(ts|flv)(\?|$)/i.test(url) ? 'mpegts' : /\.(mp4|mkv|webm|mov|m4v|avi)(\?|$)/i.test(url) ? 'file' : 'unknown';
  play({ name: url.split('/').pop().split('?')[0] || 'stream', url, type, headers: {}, group: '' });
};
$('dlBtn').onclick = download;
$('copyBtn').onclick = () => current && navigator.clipboard?.writeText(current.url);
$('jobs').onclick = async (e) => { const id = e.target.dataset.job; if (id) { await fetch('/api/downloads/' + id, { method: 'DELETE' }); pollJobs(); } };

fetch('/api/info').then((r) => r.json()).then((i) => {
  $('outDir').textContent = 'Saved to ' + i.outDir + (i.ffmpeg ? '' : ' — ffmpeg missing: only direct file downloads work');
});
const last = store.get('lastPlaylist'); if (last) { $('plUrl').value = last; loadPlaylist(last); }
pollJobs();
</script>
</body>
</html>
